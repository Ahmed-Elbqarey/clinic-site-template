<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>موقع عيادة</title>
<style>
:root{--primary:#14327a;--accent:#2f8fcf;--soft:#e8f4fc;--ink:#1c2433;--mut:#5b6678}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);background:#fff;line-height:1.7}
.demo-bar{background:var(--primary);color:#fff;text-align:center;font-size:13px;padding:6px 10px}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e3ecf3;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--primary);font-weight:700}
.brand .logo{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
.brand small{display:block;font-size:12px;color:var(--mut);font-weight:400}
nav{display:flex;gap:14px;align-items:center;font-size:15px}nav a{color:var(--ink);text-decoration:none}
.btn{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:12px 26px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--primary)}.btn.small{padding:4px 16px}
.btn.ghost{background:transparent;color:var(--primary);border:2px solid var(--primary)}
.btn.ghost:hover{background:var(--primary);color:#fff}
section{padding:40px 18px;max-width:1000px;margin:auto}
h1{font-size:30px;line-height:1.3;margin:6px 0 10px;color:var(--primary)}
h2{font-size:24px;color:var(--primary);margin:0 0 16px}
.hero{display:grid;gap:22px;align-items:center}
.eyebrow{color:var(--accent);font-weight:700;margin:0}
.hero-img{width:100%;border-radius:20px;box-shadow:0 10px 30px #0002;aspect-ratio:16/10;object-fit:cover;background:linear-gradient(135deg,var(--accent),var(--primary))}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.grid{display:grid;gap:14px;grid-template-columns:1fr 1fr}
article{background:var(--soft);border-top:4px solid var(--accent);border-radius:16px;padding:16px}
article h3{margin:0;font-size:17px;color:var(--primary)}article p{margin:4px 0 0;font-size:14px;color:var(--mut)}
.note{color:var(--mut);font-size:14px}
.about{display:grid;gap:18px;align-items:center;grid-template-columns:auto 1fr;background:var(--soft);border-radius:20px;max-width:960px;margin:10px auto}
.about img,.about .ph-doc{border-radius:50%;width:120px;height:120px;object-fit:cover;border:4px solid #fff;background:var(--accent)}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ba figure{margin:0;text-align:center}
.ph{aspect-ratio:4/3;border:2px dashed var(--accent);border-radius:14px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--accent);font-weight:700;background:#f8fbff;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}.ph small{font-weight:400;color:var(--mut)}
figcaption{margin-top:6px;font-weight:700;color:var(--primary)}
.tip{width:100%;max-width:520px;display:block;margin:auto;border-radius:18px;box-shadow:0 8px 24px #0002}
.book-grid{display:grid;gap:20px}
.info{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.info b{display:block;color:var(--accent);font-size:13px}.info a{color:var(--primary)}
form{background:var(--soft);padding:18px;border-radius:18px;display:grid;gap:12px}
label{display:grid;gap:4px;font-weight:700;font-size:14px}
input,select{font:inherit;padding:11px;border:1px solid #c5d7e4;border-radius:10px;background:#fff}
footer{background:var(--primary);color:#fff;text-align:center;padding:24px 16px}
footer p{margin:4px 0}.small{font-size:12px;opacity:.85}
[hidden]{display:none!important}
@media(min-width:760px){.hero{grid-template-columns:1fr 1.1fr}h1{font-size:40px}.grid{grid-template-columns:repeat(3,1fr)}.book-grid{grid-template-columns:1fr 1fr}.about img,.about .ph-doc{width:180px;height:180px}}
.gal{display:grid;gap:12px;grid-template-columns:1fr 1fr}.gal figure{margin:0}.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;box-shadow:0 6px 18px #0002;display:block}.gal figure:first-child{grid-column:1/-1}.gal figure:first-child img{aspect-ratio:16/9}@media(min-width:760px){.gal{grid-template-columns:repeat(3,1fr)}.gal figure:first-child{grid-column:auto;grid-row:span 1}.gal figure:first-child img{aspect-ratio:4/3}}.cap{color:var(--mut);font-size:13px;margin-top:8px}</style>
</head>

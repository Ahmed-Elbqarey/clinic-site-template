<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>موقع عيادة</title>
<style>
:root{--primary:#14327a;--accent:#2f8fcf;--soft:#e8f4fc;--ink:#1c2433;--mut:#5b6678}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);background:#fff;line-height:1.7}
.demo-bar{background:var(--primary);color:#fff;text-align:center;font-size:13px;padding:6px 10px}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e3ecf3;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--primary);font-weight:700}
.brand .logo{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
.brand small{display:block;font-size:12px;color:var(--mut);font-weight:400}
nav{display:flex;gap:14px;align-items:center;font-size:15px}nav a{color:var(--ink);text-decoration:none}
.btn{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:12px 26px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--primary)}.btn.small{padding:4px 16px}
.btn.ghost{background:transparent;color:var(--primary);border:2px solid var(--primary)}
.btn.ghost:hover{background:var(--primary);color:#fff}
section{padding:40px 18px;max-width:1000px;margin:auto}
h1{font-size:30px;line-height:1.3;margin:6px 0 10px;color:var(--primary)}
h2{font-size:24px;color:var(--primary);margin:0 0 16px}
.hero{display:grid;gap:22px;align-items:center}
.eyebrow{color:var(--accent);font-weight:700;margin:0}
.hero-img{width:100%;border-radius:20px;box-shadow:0 10px 30px #0002;aspect-ratio:16/10;object-fit:cover;background:linear-gradient(135deg,var(--accent),var(--primary))}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.grid{display:grid;gap:14px;grid-template-columns:1fr 1fr}
article{background:var(--soft);border-top:4px solid var(--accent);border-radius:16px;padding:16px}
article h3{margin:0;font-size:17px;color:var(--primary)}article p{margin:4px 0 0;font-size:14px;color:var(--mut)}
.note{color:var(--mut);font-size:14px}
.about{display:grid;gap:18px;align-items:center;grid-template-columns:auto 1fr;background:var(--soft);border-radius:20px;max-width:960px;margin:10px auto}
.about img,.about .ph-doc{border-radius:50%;width:120px;height:120px;object-fit:cover;border:4px solid #fff;background:var(--accent)}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ba figure{margin:0;text-align:center}
.ph{aspect-ratio:4/3;border:2px dashed var(--accent);border-radius:14px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--accent);font-weight:700;background:#f8fbff;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}.ph small{font-weight:400;color:var(--mut)}
figcaption{margin-top:6px;font-weight:700;color:var(--primary)}
.tip{width:100%;max-width:520px;display:block;margin:auto;border-radius:18px;box-shadow:0 8px 24px #0002}
.book-grid{display:grid;gap:20px}
.info{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.info b{display:block;color:var(--accent);font-size:13px}.info a{color:var(--primary)}
form{background:var(--soft);padding:18px;border-radius:18px;display:grid;gap:12px}
label{display:grid;gap:4px;font-weight:700;font-size:14px}
input,select{font:inherit;padding:11px;border:1px solid #c5d7e4;border-radius:10px;background:#fff}
footer{background:var(--primary);color:#fff;text-align:center;padding:24px 16px}
footer p{margin:4px 0}.small{font-size:12px;opacity:.85}
[hidden]{display:none!important}
@media(min-width:760px){.hero{grid-template-columns:1fr 1.1fr}h1{font-size:40px}.grid{grid-template-columns:repeat(3,1fr)}.book-grid{grid-template-columns:1fr 1fr}.about img,.about .ph-doc{width:180px;height:180px}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ==========================================================
   الإعدادات: دي الحاجة الوحيدة اللي بتتغير لكل عيادة.
   غيّر القيم اللي تحت بس، وسيب باقي الملف زي ما هو.
   كل القيم الحالية أمثلة، مش بيانات عيادة حقيقية.
   ========================================================== */
const CONFIG = {
  // --- الهوية ---
  clinicName:  "عيادة الابتسامة",            // اسم العيادة (بيظهر في العنوان وأعلى الصفحة)
  doctorName:  "د. اسم الدكتور",             // اسم الدكتور
  nameEn:      "Dental Clinic",              // الاسم بالإنجليزي تحت الاسم (اختياري، سيبه "" لو مش عايزه)
  specialty:   "أخصائي طب الفم والأسنان",   // التخصص
  tagline:     "ابتسامتك تستاهل عناية خاصة", // العنوان الكبير
  intro:       "علاج أسنان الأطفال، حشوات تجميلية، تركيبات وتقويم.", // سطر تحت العنوان
  about:       "أخصائي طب الفم والأسنان.",  // نبذة عن الدكتور

  // --- التواصل ---
  city:     "اسم المدينة",
  address:  "العنوان بالتفصيل",
  phone:    "01000000000",                   // رقم التليفون (أرقام بس)
  whatsapp: "201000000000",                  // واتساب بالصيغة الدولية بدون + (مصر: 20 ثم الرقم بدون صفر)
  email:    "",                              // اختياري
  hours:    "",                              // مثال: "السبت - الخميس من 4 إلى 9 مساءً" (اتركه "" لو مش متأكد)
  mapUrl:   "",                              // رابط الخريطة من جوجل (اختياري)

  // --- الخدمات (عدّل/أضف/احذف) ---
  services: ["أسنان الأطفال","علاج العصب","حشوات تجميلية","التركيبات","جراحات الأسنان","التقويم"],

  // --- الألوان (HEX) ---
  colors: { primary:"#14327a", accent:"#2f8fcf", soft:"#e8f4fc" },

  // --- الصور (روابط أو أسماء ملفات؛ سيبهم "" ويتعمل بديل بدون صورة) ---
  heroImage:   "",   // صورة العيادة أو الغلاف
  doctorImage: "",   // صورة الدكتور
  tipImage:    "",   // بوستر نصيحة (اختياري)
  beforeImage: "",   // قبل (بموافقة المريض فقط، بدون ملامح)
  afterImage:  "",   // بعد

  // --- السلوك ---
  bookingMode: "demo",  // "demo" = الزر للتجربة ومبيبعتش حاجة | "whatsapp" = يفتح واتساب العيادة برسالة جاهزة
  demoBanner:  true,    // true = شريط "فكرة توضيحية" أعلى الصفحة (خليه true قبل موافقة الدكتور)
  demoText:    "فكرة موقع توضيحية (Demo)، مش الموقع الرسمي للعيادة. التصميم والمحتوى قابلين للتعديل",
  credit:      { text:"نموذج توضيحي أعده [اسمك]، مطور مواقع.", whatsapp:"201033892219", button:"تواصل معي على واتساب" } // whatsapp:"" يخفي الزر
};
/* ================== نهاية الإعدادات ================== */

(function(){
  const C=CONFIG, $=s=>document.querySelector(s);
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const r=document.documentElement.style;
  r.setProperty('--primary',C.colors.primary);r.setProperty('--accent',C.colors.accent);r.setProperty('--soft',C.colors.soft);
  document.title=C.doctorName+" | "+C.clinicName;
  const meta=document.createElement('meta');meta.name='description';
  meta.content=C.clinicName+" - "+C.specialty+(C.city?" في "+C.city:"")+". "+C.intro;document.head.appendChild(meta);
  const ld={"@context":"https://schema.org","@type":"Dentist",name:C.clinicName,description:C.specialty,telephone:"+"+C.whatsapp,
    address:{"@type":"PostalAddress",streetAddress:C.address,addressLocality:C.city,addressCountry:"EG"}};
  if(C.email)ld.email=C.email;
  const s=document.createElement('script');s.type='application/ld+json';s.text=JSON.stringify(ld);document.head.appendChild(s);

  const img=(src,alt,cls)=>src?`<img ${cls?`class="${cls}" `:''}src="${esc(src)}" alt="${esc(alt)}">`:'';
  const logo=C.doctorImage?`<img class="logo" src="${esc(C.doctorImage)}" alt="${esc(C.doctorName)}">`:`<span class="logo">🦷</span>`;
  const info=[
    C.address?`<li><b>العنوان</b> ${esc(C.address)}${C.city?'، '+esc(C.city):''}${C.mapUrl?` · <a href="${esc(C.mapUrl)}">الخريطة</a>`:''}</li>`:'',
    C.hours?`<li><b>المواعيد</b> ${esc(C.hours)}</li>`:'',
    C.phone?`<li><b>التليفون</b> <a href="tel:${esc(C.phone)}">${esc(C.phone)}</a></li>`:'',
    C.whatsapp?`<li><b>واتساب</b> <a href="https://wa.me/${esc(C.whatsapp)}">${esc(C.phone||C.whatsapp)}</a></li>`:'',
    C.email?`<li><b>إيميل</b> <a href="mailto:${esc(C.email)}">${esc(C.email)}</a></li>`:''
  ].join('');
  const ba=(src,label)=>`<figure><div class="ph">${src?`<img src="${esc(src)}" alt="${label}">`:`صورة ${label}<small>مكان صورة الحالة</small>`}</div><figcaption>${label}</figcaption></figure>`;
  const demo=C.bookingMode!=="whatsapp";

  $('#app').innerHTML=`
  ${C.demoBanner?`<div class="demo-bar">${esc(C.demoText)}</div>`:''}
  <header class="top">
    <a class="brand" href="#top">${logo}<span>${esc(C.doctorName)}<small>${esc(C.nameEn||C.clinicName)}</small></span></a>
    <nav><a href="#services">الخدمات</a><a href="#cases">قبل وبعد</a>${C.tipImage?'<a href="#tips">نصائح</a>':''}<a href="#book" class="btn small">احجز</a></nav>
  </header>
  <main id="top">
  <section class="hero">
    <div>
      <p class="eyebrow">${esc(C.specialty)}${C.city?' · '+esc(C.city):''}</p>
      <h1>${esc(C.tagline)}</h1>
      <p>${esc(C.intro)}</p>
      <div class="actions"><a class="btn" href="#book">احجز موعدك</a>${C.phone?`<a class="btn ghost" href="tel:${esc(C.phone)}">اتصل: ${esc(C.phone)}</a>`:''}</div>
    </div>
    ${C.heroImage?img(C.heroImage,C.clinicName,'hero-img'):'<div class="hero-img" role="img" aria-label="'+esc(C.clinicName)+'"></div>'}
  </section>
  <section id="services"><h2>الخدمات</h2><div class="grid">${C.services.map(x=>`<article><h3>${esc(x)}</h3></article>`).join('')}</div></section>
  <section class="about">${C.doctorImage?img(C.doctorImage,C.doctorName):'<div class="ph-doc"></div>'}<div><h2>عن الدكتور</h2><p>${esc(C.doctorName)}، ${esc(C.about)}</p></div></section>
  <section id="cases"><h2>قبل وبعد</h2><p class="note">هنا هتتعرض نتايج الحالات، وبتتنشر بموافقة المريض بس.</p><div class="ba">${ba(C.beforeImage,'قبل')}${ba(C.afterImage,'بعد')}</div></section>
  ${C.tipImage?`<section id="tips"><h2>نصيحة من الدكتور</h2>${img(C.tipImage,'نصيحة','tip')}</section>`:''}
  <section id="book"><h2>احجز موعدك</h2><div class="book-grid">
    <ul class="info">${info}</ul>
    <form id="f"><label>الاسم<input name="n" required autocomplete="name"></label>
      <label>رقم الموبايل<input name="p" required inputmode="tel" autocomplete="tel"></label>
      <label>الخدمة<select name="s"><option>كشف</option>${C.services.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label>
      <button class="btn" type="submit">${demo?'أرسل طلب الحجز (تجربة)':'ابعت الطلب على واتساب'}</button>
      <p class="note" id="msg" hidden></p>
      <p class="note">${demo?'في الموقع الفعلي، الزر هيوصل الطلب للعيادة. هنا للتجربة بس، فمتكتبش بيانات حقيقية.':'هيفتح واتساب برسالة جاهزة، وانت اللي بتبعتها.'}</p>
    </form></div></section>
  </main>
  <footer><p>© ${esc(C.clinicName)}</p>${C.credit&&C.credit.text?`<p class="small">${esc(C.credit.text)}</p>`:''}
    ${C.credit&&C.credit.whatsapp?`<p><a class="btn small" href="https://wa.me/${esc(C.credit.whatsapp)}">${esc(C.credit.button||'واتساب')}</a></p>`:''}</footer>`;

  $('#f').addEventListener('submit',function(e){
    e.preventDefault();const d=new FormData(this);
    if(demo){const m=$('#msg');m.hidden=false;m.textContent='ده نموذج توضيحي: الطلب مش بيتبعت لأي حد، ومفيش بيانات بتتسجل.';return;}
    const t='أهلاً '+C.doctorName+'، أنا '+d.get('n')+'، رقمي '+d.get('p')+'، عايز أحجز: '+d.get('s');
    window.open('https://wa.me/'+C.whatsapp+'?text='+encodeURIComponent(t),'_blank');
  });
})();
</script>
</body>
</html>
